<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena Interactiva</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #ffffff;
      position: relative;
    }

    .haiku {
      position: absolute;
      top: 5%;
      left: 5%;
      font-family: serif;
      font-size: 1.5rem;
      color: #333;
      z-index: 10;
      user-select: none;
      line-height: 1.6;
    }

    .person {
      position: absolute;
      right: 45%;
      bottom: 0;
      height: 50vh;
      object-fit: contain;
      z-index: 2;
      user-select: none;
    }

    .block {
      height: 100%;
      position: absolute;
      width: 50%;
      right: 0;
      z-index: 1;
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .roof {
      display: block;
      align-self: flex-start;
      height: 60vh;
      width: auto;
    }

    .girl {
      height: 50vh;
      object-fit: contain;
    }

    #scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Pantalla de bloqueo si está en vertical */
    #orientation-lock {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(255, 255, 255, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: sans-serif;
      padding: 20px;
      box-sizing: border-box;
      transition: opacity 0.5s ease;
    }

    #orientation-lock h2 {
      color: #333;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    #orientation-lock p {
      color: #666;
      font-size: 1.1rem;
    }

    .rotate-icon {
      font-size: 3rem;
      margin-bottom: 20px;
      animation: rotateAnim 2s infinite ease-in-out;
    }

    @keyframes rotateAnim {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }

    /* Mensaje para iniciar música */
    #music-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 0.95rem;
      z-index: 999;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: opacity 0.5s ease;
      text-align: center;
    }

    /* Adaptabilidad al girar la pantalla */
    @media (orientation: portrait) {
      .person { height: 40vh; right: 40%; }
      .roof { height: 45vh; }
      .girl { height: 40vh; }
      .haiku { font-size: 1.2rem; }
    }

    @media (orientation: landscape) {
      .person { height: 55vh; }
      .roof { height: 65vh; }
      .girl { height: 55vh; }
      /* Si está en horizontal en un celular o tablet, ocultamos el aviso de bloqueo */
      #orientation-lock {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Mensaje de bloqueo por orientación vertical -->
  <div id="orientation-lock">
    <div class="rotate-icon">📱 ⟳</div>
    <h2>Gira tu pantalla</h2>
    <p>Por favor, pon tu dispositivo en horizontal para desbloquear y ver la escena de la mejor manera. Creador VIC PERSI</p>
  </div>

  <!-- Botón / Aviso flotante para iniciar la música -->
  <div id="music-prompt">🎵 Toca tu pantalla para empezar la música</div>

  <div class="haiku" lang="jp">
    花は散り<br>
    名を覚えている<br>
    風ばかり Creador : VIC PERSI
  </div>

  <img class="person" src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/person.png" alt="man">

  <div class="block">
    <img class="girl" src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/girl.png" alt="girl">
    <img src="https://raw.githubusercontent.com/BlackStar1991/Pictures-for-sharing-/master/Japan/bg.png" alt="roof" class="roof">
  </div>

  <canvas id="scene"></canvas>

  <!-- Audio de fondo (melodía de caja de música/ambiente con licencia libre vía Web Audio API o enlace directo) -->
  <audio id="bg-audio" loop>
    <source src="amor.mp3" type="audio/ogg">
    Tu navegador no soporta audio.
  </audio>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const lockScreen = document.getElementById("orientation-lock");
    const musicPrompt = document.getElementById("music-prompt");
    const audio = document.getElementById("bg-audio");

    let width = 0;
    let height = 0;
    let particles = [];
    let musicStarted = false;

    // Control de orientación por JS para forzar en dispositivos donde CSS a veces tarda
    function checkOrientation() {
      // Si la anchura es mayor que la altura, está en horizontal (landscape)
      if (window.innerWidth > window.innerHeight) {
        lockScreen.style.opacity = '0';
        setTimeout(() => { lockScreen.style.display = 'none'; }, 500);
      } else {
        lockScreen.style.display = 'flex';
        lockScreen.style.opacity = '1';
      }
    }

    window.addEventListener("resize", () => {
      resizeCanvas();
      checkOrientation();
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(checkOrientation, 200);
    });

    // Evento para activar la música al tocar la pantalla por primera vez
    window.addEventListener("click", () => {
      if (!musicStarted) {
        audio.play().then(() => {
          musicStarted = true;
          musicPrompt.style.opacity = '0';
          setTimeout(() => { musicPrompt.style.display = 'none'; }, 500);
        }).catch(e => console.log("Audio play blocked", e));
      }
    });

    const settings = {
      bgColor: "transparent",
      minWind: 1,
      maxWind: 10,
      minSize: 14,
      maxSize: 38,
      emitterY: 0.15,
      emitterSpread: 0.85,
      gravity: 0.6,
      turbulence: 0.8,
      rotationSpeed: 0.02,
      tumbleStrength: 0.4,
      staticTilt: 0,
      particleCount: 150,
      direction: -1
    };

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    resizeCanvas();
    checkOrientation();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width * settings.emitterSpread;
        this.y = -50;
        this.size = Math.random() * (settings.maxSize - settings.minSize) + settings.minSize;
        this.speedX = (Math.random() * (settings.maxWind - settings.minWind) + settings.minWind) * settings.direction;
        this.speedY = Math.random() * 2 + 1;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * settings.rotationSpeed;
      }

      update() {
        this.x += this.speedX + Math.sin(this.y * 0.01) * settings.turbulence;
        this.y += this.speedY + settings.gravity;
        this.angle += this.spin;

        if (this.y > height + 50 || this.x < -50 || this.x > width + 50) {
          this.reset();
          this.y = -10;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = "#ffb7c5"; // Color pétalo de cerezo
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size / 2, this.size / 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < settings.particleCount; i++) {
        let p = new Particle();
        p.y = Math.random() * height;
        particles.push(p);
      }
    }

    initParticles();

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
